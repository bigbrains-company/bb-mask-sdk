[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-mask"
version = "0.3.0"
description = "Data Mask istemcisi: metin ve dosya anonimleştirme, restore. Model çağrısı yok."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "BigBrains"}]
keywords = ["anonymization", "kvkk", "pii", "data-mask", "bigbrains"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://app.bbmask.co"
Documentation = "https://app.bbmask.co/#/sdk"
Repository = "https://github.com/bigbrains-company/bb-mask-sdk"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bb_mask*"]

[tool.setuptools.package-data]
bb_mask = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
